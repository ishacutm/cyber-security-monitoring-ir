{% extends 'base.html' %}{% from '_components.html' import alert_table with context %}{% block content %}<section class="panel"><form class="filters" method="get"><label>Severity<select name="severity"><option value="">All severities</option>{% for s in severities %}<option {{ 'selected' if s==severity }}>{{ s }}</option>{% endfor %}</select></label><label>Status<select name="status"><option value="">All statuses</option>{% for s in ['OPEN','ACKNOWLEDGED','CLOSED'] %}<option {{ 'selected' if s==status }}>{{ s }}</option>{% endfor %}</select></label><button>Apply filters</button><a href="{{ url_for('alerts') }}">Reset</a></form>{{ alert_table(alerts) }}</section>{% endblock %}
